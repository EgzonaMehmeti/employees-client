<h2 mat-dialog-title>{{ data?.title || 'Dialog Title' }}</h2>

<mat-dialog-content class="dialog-content">
  <p>{{ data?.message || 'Fill the data' }}</p>
   <div>
    <mat-form-field appearance="outline" class="w-full">
        <mat-label>First Name</mat-label>
        <input matInput [(ngModel)]="form.name">
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
        <mat-label>Last Name</mat-label>
        <input matInput [(ngModel)]="form.surname">
    </mat-form-field>
   </div>
   <div>
    <mat-form-field appearance="outline" class="w-full">
        <mat-label>Age</mat-label>
        <input matInput [(ngModel)]="form.age">
    </mat-form-field>
    <mat-form-field appearance="outline" class="w-full">
        <mat-label>Department</mat-label>
        <mat-select [(ngModel)]="form.departmentId">
            @for(department of departmentsList; track department){
                <mat-option [value]="department.id">
                    {{ department.name }}
                </mat-option>}
        </mat-select>
    </mat-form-field>
   </div>
   <div>
    <mat-form-field appearance="outline" class="w-full">
        <mat-label>Role</mat-label>
        <input matInput [(ngModel)]="form.role">
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
        <mat-label>Hire Date</mat-label>
        <input matInput [(ngModel)]="form.hireDate">
    </mat-form-field>
   </div>
   <div>
    <mat-form-field appearance="outline" class="w-full">
        <mat-label>Email</mat-label>
        <input matInput [(ngModel)]="form.email">
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
        <mat-label>Phone Number</mat-label>
        <input matInput [(ngModel)]="form.phone">
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
        <mat-label>Salary</mat-label>
        <input matInput [(ngModel)]="form.salary">
    </mat-form-field>
   </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button matButton="tonal" mat-dialog-close color="primary">Cancel</button>
  <button color="primary" (click)="save()">Save</button>
</mat-dialog-actions>
