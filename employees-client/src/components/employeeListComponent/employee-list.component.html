<div class="employee-table-container">
  <mat-form-field appearance="fill">
    <mat-label>Search Employees</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Search by name">
  </mat-form-field>

  <table mat-table [dataSource]="dataSource" matSort (matSortChange)="onSortChange()" class="mat-elevation-z8">

    <!-- ID Column -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
      <td mat-cell *matCellDef="let employee">{{employee.id}}</td>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="displayName">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Full Name</th>
      <td mat-cell *matCellDef="let employee">{{employee.name + ' ' + employee.surname}}</td>
    </ng-container>

    <!-- Department Column -->
    <ng-container matColumnDef="department">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Department</th>
      <td mat-cell *matCellDef="let employee">{{employee.department.name}}</td>
    </ng-container>

    <!-- Role Column -->
    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Role</th>
      <td mat-cell *matCellDef="let employee">{{employee.role}}</td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let employee">
        <button mat-button color="primary" (click)="addEditEmployee('edit', departmentsList, employee, employee.id)"><mat-icon>edit</mat-icon></button>
        <button mat-button color="warn" (click)="deleteEmployee(employee)"><mat-icon>delete</mat-icon></button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  <div class="button-add">
    <button mat-mini-fab color="primary" (click)="addEditEmployee('add', departmentsList)">
      <mat-icon class="icon-add">add</mat-icon>
    </button>
  </div>
  <mat-paginator (page)="onPageChange()" [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons></mat-paginator>
</div>
