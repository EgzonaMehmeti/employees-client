<div class="login-container">
  <h2>Sign In</h2>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <input
      type="email"
      formControlName="email"
      placeholder="Email"
    />

    <input
      type="password"
      formControlName="password"
      placeholder="Password"
    />

    <button mat-button type="submit" [disabled]="loginForm.invalid">
      Login
    </button>

    @if(errorMessage){
    <p class="error">
      {{ errorMessage }}
    </p>}
  </form>
</div>
